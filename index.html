<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sjoelbak tegen Omnia v5.3</title><style>body{margin:0;background:#17251d;color:#f6e8cb;font-family:system-ui;text-align:center}main{max-width:440px;margin:auto;padding:12px}input,select,button{font:inherit;padding:10px;border-radius:9px;border:0}button{background:#d3a45c;color:#23190c;font-weight:700;margin:5px}input{width:125px}canvas{width:min(95%,350px);touch-action:none;border:8px solid #70431f;border-radius:10px;background:#dbac70}#info{min-height:48px}small{opacity:.7}</style></head><body><main><h2>Sjoelbak tegen Omnia</h2><div><input id="name" placeholder="Jouw naam" maxlength="20" value="Speler"><select id="level"><option value="easy">Beginner</option><option value="normal" selected>Normaal</option><option value="hard">Expert</option></select></div><button id="new">Nieuw spel</button><button id="next">Volgende beurt</button><div id="info"></div><canvas id="board" width="350" height="650"></canvas><p><small>Sleep vanaf de schijf naar beneden om kracht op te bouwen en laat los.<br>© Teekay & Omnia 2026</small></p></main><script>
(()=>{const c=document.querySelector('#board'),g=c.getContext('2d'),info=document.querySelector('#info');let name='Speler',player=0,round=1,ammo=30,discs=[],shot=null,drag=null,aiPending=false,finished=false;const vals=[2,3,4,1],R=17,top=104,GAP=49;const records=[[],[]];let playerRound=1;function ready(){return discs.find(d=>d.ready)}function moving(){return discs.some(d=>!d.scored&&!d.ready&&Math.hypot(d.vx,d.vy)>.12)}function spawn(){if(finished||ammo<=0||moving()||ready())return;discs.push({x:175,y:588,vx:0,vy:0,ready:true,scored:false,slot:-1})}function count(){let a=[0,0,0,0];discs.filter(d=>d.scored).forEach(d=>a[d.slot]++);return a}function score(a){let n=Math.min(...a);return n*20+a.reduce((s,v,i)=>s+(v-n)*vals[i],0)}function total(p){let a=[0,0,0,0];records[p].forEach(r=>r.forEach((n,i)=>a[i]+=n));if(p===player)count().forEach((n,i)=>a[i]+=n);return score(a)}function hud(){let p=player===0?name:'Omnia';info.innerHTML=`<b>${name}: ${total(0)} &nbsp;|&nbsp; Omnia: ${total(1)}</b><br>${finished?'Wedstrijd afgelopen':p+' · ronde '+round+'/3 · '+ammo+' schijven over'}`}
function draw(){let bg=g.createLinearGradient(0,0,350,0);bg.addColorStop(0,'#b87c3e');bg.addColorStop(.5,'#efc990');bg.addColorStop(1,'#b87c3e');g.fillStyle=bg;g.fillRect(0,0,350,650);g.strokeStyle='#c9985e';for(let i=0;i<20;i++){g.beginPath();g.moveTo(i*21,0);g.lineTo(i*21-8,650);g.stroke()}g.fillStyle='#69401e';for(let i=0;i<4;i++){let center=(i+.5)*87.5,left=center-GAP/2,start=i*87.5,end=start+87.5;g.fillRect(start,top-8,Math.max(0,left-start),8);g.fillRect(left+GAP,top-8,Math.max(0,end-(left+GAP)),8)}for(let i=0;i<4;i++){let center=(i+.5)*87.5,left=center-GAP/2;g.fillStyle='#2b2018';g.fillRect(left,22,GAP,65);g.fillStyle='#f6dfaa';g.font='bold 23px system-ui';g.textAlign='center';g.fillText(vals[i],center,60);g.fillStyle='#805025';g.fillRect(left-8,86,8,34);g.fillRect(left+GAP,86,8,34)}discs.forEach(d=>{g.beginPath();g.arc(d.x,d.y,R,0,7);g.fillStyle=d.ready?'#e5b779':'#97622e';g.fill();g.lineWidth=2;g.strokeStyle='#fff0cb';g.stroke()});if(drag&&ready()){g.strokeStyle='white';g.lineWidth=3;g.beginPath();g.moveTo(ready().x,ready().y);g.lineTo(drag.x,drag.y);g.stroke()}hud()}
function shoot(vx,vy){let d=ready();if(!d)return;d.ready=false;d.vx=vx;d.vy=vy;drag=null}function tick(){for(const d of discs){if(d.ready||d.scored)continue;d.x+=d.vx;d.y+=d.vy;d.vx*=.987;d.vy*=.987;if(Math.abs(d.vx)<.025)d.vx=0;if(Math.abs(d.vy)<.025)d.vy=0;if(d.x<R){d.x=R;d.vx=Math.abs(d.vx)*.28}if(d.x>350-R){d.x=350-R;d.vx=-Math.abs(d.vx)*.28}if(d.y>650-R){d.y=650-R;d.vy=-Math.abs(d.vy)*.25}if(d.y<top+R&&d.y>top-R){let i=Math.max(0,Math.min(3,Math.floor(d.x/87.5))),center=(i+.5)*87.5;let fits=Math.abs(d.x-center)<=(GAP/2-R);if(!fits){d.y=top+R;d.vy=Math.abs(d.vy)*.08}else{d.vy=Math.min(d.vy,-0.15)}}if(d.y<58&&!d.scored){let i=Math.max(0,Math.min(3,Math.floor(d.x/87.5))),center=(i+.5)*87.5;if(Math.abs(d.x-center)<=(GAP/2-R)){d.scored=true;d.slot=i;d.vx=0;d.vy=0;d.x=center;d.y=66}}}for(let i=0;i<discs.length;i++)for(let j=i+1;j<discs.length;j++){let a=discs[i],b=discs[j];if(a.scored||b.scored||a.ready||b.ready)continue;let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||.001;if(dist<2*R){let nx=dx/dist,ny=dy/dist,over=2*R-dist;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;let rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx*.92;a.vy-=rel*ny*.92;b.vx+=rel*nx*.92;b.vy+=rel*ny*.92}}}if(!moving()&&!ready()&&!finished&&ammo>0){spawn();}if(player===1&&!aiPending&&ready()&&!moving()&&!finished){aiPending=true;setTimeout(()=>{aiPending=false;if(player!==1||finished||moving()||!ready())return;let level=document.querySelector('#level').value;let err={easy:48,normal:23,hard:9}[level];let target=(Math.floor(Math.random()*4)+.5)*87.5+(Math.random()-.5)*err;let dx=target-175;shoot(dx/58,-(level==='easy'?14:17));ammo--;},420)}draw();requestAnimationFrame(tick)}function next(){if(finished||moving())return;records[player].push(count());discs=[];if(round<3){round++;ammo=Math.max(0,30-records[player].reduce((s,a)=>s+a.reduce((u,v)=>u+v,0),0))}else if(player===0){player=1;round=1;ammo=30}else{finished=true;let a=total(0),b=total(1);info.innerHTML=(a===b?'Gelijkspel!':(a>b?name:'Omnia')+' wint!')+' '+a+' – '+b;return}spawn()}function reset(){name=document.querySelector('#name').value.trim()||'Speler';player=0;round=1;ammo=30;discs=[];records[0]=[];records[1]=[];finished=false;aiPending=false;spawn()}function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*350/r.width,y:(e.clientY-r.top)*650/r.height}}c.addEventListener('pointerdown',e=>{if(player!==0||finished||moving())return;let d=ready(),p=point(e);if(d&&Math.hypot(p.x-d.x,p.y-d.y)<65){drag=p;c.setPointerCapture(e.pointerId)}});c.addEventListener('pointermove',e=>{if(drag)drag=point(e)});c.addEventListener('pointerup',e=>{if(!drag)return;let p=point(e),d=ready();if(d){let dx=d.x-p.x,dy=d.y-p.y;shoot(Math.max(-9,Math.min(9,dx*.12)),Math.max(-22,Math.min(-3,dy*.19)));ammo--}drag=null});document.querySelector('#new').onclick=reset;document.querySelector('#next').onclick=next;reset();tick()})();
</script></body></html>
